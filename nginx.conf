events {
    worker_connections 1024;
}

http {
    upstream convert-file {
        server convert_file:3000;
    }

    # login: 5 ครั้ง/นาที/IP (burst 5) ชั้นแรกก่อนถึงตัวนับในแอป
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    server {
        listen 80;
        listen [::]:80;

        server_name dcsa-daikin.com;

        # header ที่แอปต้องใช้ (Host สำหรับ redirect, X-Real-IP สำหรับ log)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 20m;

        location = /api/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://convert-file;
        }

        location / {
            proxy_pass http://convert-file;
        }
    }
}
