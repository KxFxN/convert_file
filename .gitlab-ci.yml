stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DEPLOY_USER: root
  DEPLOY_HOST: ${DEPLOY_HOST}
  SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}

default:
  image: docker:25.0.5
  services:
    - docker:dind
  before_script:
    - echo "Docker login to GitLab Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build_project:
  stage: build
  script:
    - echo "Building the Production..."
    - docker build -t $CI_REGISTRY_IMAGE/nextjs:$CI_COMMIT_SHORT_SHA -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/nextjs:$CI_COMMIT_SHORT_SHA

deploy_production:
  stage: deploy 
  script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

    - > 
      ssh $DEPLOY_USER@$DEPLOY_HOST "
      if [ ! -d ~/convert_file ]; then
        git clone https://github.com/KxFxN/convert_file.git ~/root
      else
        cd ~/convert_file && git pull; 
      fi &&
      cd ~/convert_file &&
      docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD &&
      docker pull $CI_REGISTRY_IMAGE/nextjs:$CI_COMMIT_SHORT_SHA &&
      docker compose down &&
      docker compose up -d
      " 